name: Test suite

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      packages: read
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9" 

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv sync --frozen --no-editable --group dev --group gpaw --group mlip
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] http://repo.mongodb.org/apt/debian bookworm/mongodb-org/8.0 main" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list > /dev/null
          sudo dpkg-divert --local --rename --add /usr/bin/mandb
          sudo ln -s /bin/true /usr/bin/mandb
          sudo apt-get update && sudo apt-get install -y --no-install-recommends mongodb-org

      - name: Run tests
        run: uv run pytest -m "not needs_mongodb and not needs_slurm and not needs_third_party_executables and not slow"
